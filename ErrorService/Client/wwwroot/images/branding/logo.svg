    <path d="M340 390l28-28c4-4 10-4 14 0l8 8c4 4 4 10 0 14l-28 28-22-22z" stroke="white" stroke-width="3" fill="none"/>
    <path d="M320 370l22 22" stroke="white" stroke-width="3" fill="none"/>
