<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1920" height="1080" fill="#f8fafc"/>
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
        </pattern>
        <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
        </radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#grid)" />
    <circle cx="10%" cy="10%" r="400" fill="url(#grad1)" />
    <circle cx="90%" cy="90%" r="600" fill="url(#grad1)" />
    <!-- Abstract technical shapes -->
    <path d="M-100 200 L400 600 L200 800" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.1" fill="none" />
    <path d="M1800 100 L1500 400 L1700 600" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.1" fill="none" />
    <rect x="1600" y="200" width="100" height="100" rx="20" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.1" fill="none" transform="rotate(15 1650 250)" />
    <circle cx="300" cy="800" r="50" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.1" fill="none" />
</svg>
