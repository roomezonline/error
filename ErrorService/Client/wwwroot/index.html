        window.seoHelper = {
            _findOrCreate: function(attr, value) {
                var el = document.querySelector('meta[' + attr + '="' + value + '"]');
                if (!el) { el = document.createElement('meta'); el.setAttribute(attr, value); document.head.appendChild(el); }
                return el;
            },
            setMeta: function(name, content) {
                if (!content) return;
                this._findOrCreate('name', name).setAttribute('content', content);
            },
            setMetaProp: function(property, content) {
                if (!content) return;
                this._findOrCreate('property', property).setAttribute('content', content);
            },
            setTitle: function(title) { if (title) document.title = title; },
            setCanonical: function(href) {
                if (!href) return;
                var el = document.querySelector('link[rel="canonical"]');
                if (!el) { el = document.createElement('link'); el.setAttribute('rel', 'canonical'); document.head.appendChild(el); }
                el.setAttribute('href', href);
            },
            setJsonLd: function(json) {
                if (!json) return;
                var existing = document.querySelector('script[type="application/ld+json"]');
                if (!existing) { existing = document.createElement('script'); existing.setAttribute('type', 'application/ld+json'); document.head.appendChild(existing); }
                existing.textContent = json;
            },
            replaceAll: function(title, desc, keywords, canonical, ogType, ogImage, jsonLd) {
                this.setTitle(title);
                this.setMeta('description', desc);
                this.setMeta('keywords', keywords);
                this.setCanonical(canonical);
                this.setMetaProp('og:type', ogType || 'website');
                this.setMetaProp('og:title', title);
                this.setMetaProp('og:description', desc);
                this.setMeta('twitter:title', title);
                this.setMeta('twitter:description', desc);
                if (ogImage) { this.setMetaProp('og:image', ogImage); this.setMeta('twitter:image', ogImage); }
                this.setJsonLd(jsonLd);
            }
        };

                    return window.__ensureGroup('charts').then(function () {
                        var real = window[name];
                        if (typeof real !== 'function' || real === stubFn) {
                            throw new Error(name + ' is not available');
                        }
                        return real.apply(null, args);
                    });
                };
                window[name] = stubFn;
            });
        })();

    <script>
        document.addEventListener('error', function(e) {
            if (e.target.tagName === 'IMG' && !e.target.src.includes('placeholder')) {
                e.target.src = '/images/placeholder-product.svg';
                e.target.onerror = null;
            }
        }, true);
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('img:not([loading])').forEach(function(img) {
                if (!img.closest('#app-splash')) img.loading = 'lazy';
            });
        });

        // Mega menu: after a link inside a panel is chosen, SPA navigation keeps
        // the pointer/focus over the item, so the CSS :hover panel stays open.
        // Close it explicitly until the pointer leaves or re-enters the trigger.
        (function () {
            document.addEventListener('click', function (e) {
                var link = e.target && e.target.closest ? e.target.closest('.mega-panel a') : null;
                var item = link && link.closest ? link.closest('.mega-item') : null;
                if (!item) return;
                item.classList.add('mega-item--closed');
                var active = document.activeElement;
                if (active && active.blur) active.blur();
            }, true);

            document.addEventListener('mouseover', function (e) {
                var trigger = e.target && e.target.closest ? e.target.closest('.mega-item--closed .mega-trigger') : null;
                var item = trigger && trigger.closest ? trigger.closest('.mega-item') : null;
                if (item) item.classList.remove('mega-item--closed');
            }, true);

            document.addEventListener('mouseout', function (e) {
                var item = e.target && e.target.closest ? e.target.closest('.mega-item--closed') : null;
                if (!item) return;
                if (e.relatedTarget && item.contains(e.relatedTarget)) return;
                item.classList.remove('mega-item--closed');
            }, true);
        })();

        window.downloadFile = function(fileName, base64) {
            var link = document.createElement('a');
            link.download = fileName;
            link.href = 'data:application/octet-stream;base64,' + base64;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.downloadWithAuth = async function(url, token, fileName) {
            try {
                var resp = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var blob = await resp.blob();
                var blobUrl = URL.createObjectURL(blob);
                var link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName || 'download.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);
            } catch (e) {
                console.error('Download failed:', e);
                window.open(url, '_blank');
            }
        };

        window.scrollToElement = function(element, block) {
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: block || 'center' });
            }
        };

        window.formatPriceInputs = function() {
            document.querySelectorAll('.price-input-ltr').forEach(function(el) {
                if (el.dataset.priceInit) return;
                el.dataset.priceInit = '1';
                el.addEventListener('input', function() {
                    var raw = this.value.replace(/,/g, '').replace(/[^0-9]/g, '');
                    if (raw) {
                        this.value = parseInt(raw, 10).toLocaleString('en-US');
                    } else {
                        this.value = '';
                    }
                });
            });
        };

        window.getPriceRawValue = function(id) {
            var el = document.getElementById(id);
            if (!el) return null;
            return (el.value || '')
                .replace(/[\u06F0-\u06F9]/g, function(c) { return String.fromCharCode(c.charCodeAt(0) - 0x06F0 + 0x30); })
                .replace(/[\u0660-\u0669]/g, function(c) { return String.fromCharCode(c.charCodeAt(0) - 0x0660 + 0x30); })
                .replace(/[,،\u066C\s]/g, '');
        };
    </script>
    <script>
        let registration;
        let deferredPrompt;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    registration = await navigator.serviceWorker.register('service-worker.js');

                    // Check for updates every 1 hour
                    setInterval(() => {
                        registration.update();
                    }, 1000 * 60 * 60);

                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    // New content is available
                                    handleUpdateAvailable();
                                }
                            }
                        };
                    };
                } catch (e) {
                    console.error('SW registration failed:', e);
                }
            });
        }

        function handleUpdateAvailable() {
            // If we are in admin panel, we might want to show a notification
            // If we are on public site, we auto-update
            const isAdmin = window.location.pathname.startsWith('/admin');

            if (!isAdmin) {
                // Auto-update for public site
                if (registration && registration.waiting) {
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
                window.location.reload();
            } else {
                // For admin, we let Blazor handle the notification via PwaUpdateDialog
                window.dispatchEvent(new CustomEvent('PwaUpdateAvailable'));
            }
        }

        // PWA Installation
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Notify Blazor that installation is possible
            window.dispatchEvent(new CustomEvent('PwaInstallAvailable'));
        });

        window.installPWA = async () => {
            if (!deferredPrompt) return false;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            return outcome === 'accepted';
        };

        window.getPwaInstallStatus = () => {
            return !!deferredPrompt;
        };

        // Detect if the app is already running as an installed (standalone) app
        window.pwaIsStandalone = () => {
            try {
                return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                    || window.navigator.standalone === true;
            } catch (e) { return false; }
        };

        // iOS (Safari) never fires beforeinstallprompt; installation is manual
        window.pwaIsIos = () => {
            return /iphone|ipad|ipod/i.test(navigator.userAgent)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        };

        // Only offer the install banner on mobile/touch devices
        window.pwaIsMobile = () => {
            return /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent)
                || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        };

        // Public-site install banner state (separate from the admin one)
        window.pwaPublicGetDismissedAt = () => localStorage.getItem('pwaPublicInstallDismissAt');
        window.pwaPublicSetDismissedAt = (ts) => localStorage.setItem('pwaPublicInstallDismissAt', String(ts));
        window.pwaPublicMarkInstalled = () => localStorage.setItem('pwaPublicInstalled', '1');
        window.pwaPublicIsInstalled = () => localStorage.getItem('pwaPublicInstalled') === '1';

        window.initPublicInstallHandler = (dotNetHelper) => {
            window.addEventListener('PwaInstallAvailable', () => {
                try { dotNetHelper.invokeMethodAsync('NotifyPublicInstallAvailable'); } catch (e) { }
            });
            window.addEventListener('appinstalled', () => {
                try { dotNetHelper.invokeMethodAsync('NotifyPublicInstalled'); } catch (e) { }
            });
        };

        window.pwaGetDismissedAt = () => {
            return localStorage.getItem('pwaInstallDismissAt');
        };

        window.pwaSetDismissedAt = (ts) => {
            localStorage.setItem('pwaInstallDismissAt', ts);
        };

        window.pwaClearDismissedAt = () => {
            localStorage.removeItem('pwaInstallDismissAt');
        };

        window.initPwaHandlers = (dotNetHelper) => {
            window.addEventListener('PwaUpdateAvailable', () => {
                dotNetHelper.invokeMethodAsync('NotifyUpdateAvailable');
            });
            window.addEventListener('PwaInstallAvailable', () => {
                dotNetHelper.invokeMethodAsync('NotifyInstallAvailable');
            });
        };

        window.initDashboardInstallHandler = (dotNetHelper) => {
            window.addEventListener('PwaInstallAvailable', () => {
                dotNetHelper.invokeMethodAsync('NotifyDashboardInstallAvailable');
            });
        };
    </script>

    <script>
        (function () {
            var splash = document.getElementById('app-splash');
            var app = document.getElementById('app');
            if (!splash || !app) return;

            var done = false;
            var failed = false;

            // The server injects a .seo-shell into #app for faster first paint.
            // It is not the real app: keep the splash until Blazor has replaced it
            // (or rendered a layout such as the maintenance/status page).
            function isAppReady() {
                if (!app.childElementCount) return false;
                if (app.querySelector('.app-wrapper, .admin-shell')) return true;
                return !app.querySelector('.seo-shell');
            }

            function hide() {
                if (done) return;
                done = true;
                splash.classList.add('app-splash--hide');
                document.documentElement.classList.remove('app-booting');
                document.documentElement.classList.add('app-ready');
                window.setTimeout(function () {
                    if (splash && splash.parentElement) {
                        splash.parentElement.removeChild(splash);
                    }
                }, 320);
            }

            function showError() {
                if (done || failed) return;
                failed = true;
                var card = splash.querySelector('.app-splash__card');
                if (card) {
                    card.innerHTML =
                        '<div class="app-splash__logo"><img class="app-splash__logo-img" src="images/branding/logo.svg" alt="لوگوی ارورسرویس" width="66" height="66" /></div>' +
                        '<div class="app-splash__brand">ارورسرویس</div>' +
                        '<div style="color:#dc3545;font-size:14px;margin:8px 0;">بارگذاری سایت با خطا مواجه شد</div>' +
                        '<div style="color:#64748b;font-size:12px;margin-bottom:12px;">لطفاً اتصال اینترنت خود را بررسی کنید</div>' +
                        '<button onclick="window.location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">تلاش مجدد</button>';
                }
            }

            function check() {
                if (isAppReady()) hide();
            }

            var observer = new MutationObserver(check);

            if (isAppReady()) {
                hide();
            } else {
                observer.observe(app, { childList: true, subtree: true });
            }

            // After 12 seconds, if Blazor still hasn't mounted, offer a retry.
            // Keep observing so a late successful mount still hides the splash.
            window.setTimeout(showError, 12000);
        })();
    </script>
