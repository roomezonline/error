  <!-- Exclamation mark / error accent replacing the crossbar -->
  <circle cx="376" cy="180" r="20" fill="url(#accentGrad)"/>
  <rect x="369" y="208" width="14" height="58" rx="7" fill="url(#accentGrad)"/>

  <!-- Subtle tool/wrench accent at bottom -->
